<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>iPractus - Reset Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col transition-colors duration-200">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-10 bg-white dark:bg-background-dark border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center p-4 justify-between max-w-[480px] mx-auto">
<div class="text-[#111418] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Reset Password</h2>
</div>
</header>
<main class="flex-1 flex flex-col max-w-[480px] mx-auto w-full bg-white dark:bg-background-dark overflow-x-hidden">
<!-- Header Section -->
<section class="px-4 pt-8">
<h1 class="text-[#111418] dark:text-white tracking-tight text-[28px] font-bold leading-tight pb-3">Create New Password</h1>
<p class="text-[#617589] dark:text-gray-400 text-base font-normal leading-normal">
                Your new password must be different from previous passwords and include security symbols.
            </p>
</section>
<!-- Form Section -->
<section class="flex flex-col gap-2 mt-6">
<!-- New Password Field -->
<div class="px-4 py-3">
<label class="flex flex-col w-full">
<p class="text-[#111418] dark:text-gray-200 text-base font-medium leading-normal pb-2">New Password</p>
<div class="flex w-full items-stretch rounded-lg shadow-sm">
<input class="form-input flex w-full min-w-0 flex-1 rounded-lg dark:bg-gray-900 text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbe0e6] dark:border-gray-700 h-14 placeholder:text-[#617589] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your new password" type="password" value="iPractus2024!"/>
<div class="text-[#617589] dark:text-gray-400 flex border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-gray-900 items-center justify-center pr-[15px] rounded-r-lg border-l-0 cursor-pointer">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<!-- Confirm New Password Field -->
<div class="px-4 py-3">
<label class="flex flex-col w-full">
<p class="text-[#111418] dark:text-gray-200 text-base font-medium leading-normal pb-2">Confirm New Password</p>
<div class="flex w-full items-stretch rounded-lg shadow-sm">
<input class="form-input flex w-full min-w-0 flex-1 rounded-lg dark:bg-gray-900 text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbe0e6] dark:border-gray-700 h-14 placeholder:text-[#617589] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Re-enter your new password" type="password" value=""/>
<div class="text-[#617589] dark:text-gray-400 flex border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-gray-900 items-center justify-center pr-[15px] rounded-r-lg border-l-0 cursor-pointer">
<span class="material-symbols-outlined">visibility_off</span>
</div>
</div>
</label>
</div>
<!-- Password Requirements List -->
<div class="px-6 py-4 space-y-3">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-5 h-5 rounded-full bg-primary text-white">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
<p class="text-sm font-medium text-primary dark:text-primary">At least 8 characters</p>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-5 h-5 rounded-full bg-primary text-white">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
<p class="text-sm font-medium text-primary dark:text-primary">Include at least one symbol (@, #, $)</p>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-5 h-5 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-400">
<!-- Unchecked placeholder circle -->
</div>
<p class="text-sm font-normal text-gray-500 dark:text-gray-400">Include at least one number</p>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-5 h-5 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-400">
<!-- Unchecked placeholder circle -->
</div>
<p class="text-sm font-normal text-gray-500 dark:text-gray-400">Passwords must match</p>
</div>
</div>
</section>
<!-- Footer Action -->
<div class="mt-auto px-4 pb-10 pt-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>Update Password</span>
<span class="material-symbols-outlined text-[20px]">lock_reset</span>
</button>
<p class="text-center mt-6 text-[#617589] dark:text-gray-400 text-sm">
                Need help? <a class="text-primary font-semibold" href="#">Contact Support</a>
</p>
</div>
</main>
<!-- Visual spacer for iOS safe area -->
<div class="h-5 bg-white dark:bg-background-dark"></div>
</body></html>
