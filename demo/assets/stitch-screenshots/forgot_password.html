<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - iPractus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen">
<div class="flex flex-col min-h-screen max-w-[480px] mx-auto bg-white dark:bg-[#111418] shadow-xl">
<!-- Navigation Bar -->
<div class="flex items-center bg-transparent p-4 justify-between">
<div class="text-[#111418] dark:text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Forgot Password</h2>
</div>
<div class="flex flex-col items-center px-4 pt-8">
<!-- App Logo/Icon Placeholder -->
<div class="mb-8">
<div class="w-20 h-20 bg-primary/10 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl">lock_reset</span>
</div>
</div>
<!-- Headline Section -->
<div class="w-full">
<h1 class="text-[#111418] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-3">Reset Password</h1>
<p class="text-[#617589] dark:text-gray-400 text-base font-normal leading-normal pb-8 px-4 text-center">
                    Enter your email address and we will send you a code to reset your password.
                </p>
</div>
<!-- Input Form Section -->
<div class="w-full space-y-6">
<div class="flex flex-col gap-4">
<label class="flex flex-col w-full">
<p class="text-[#111418] dark:text-white text-sm font-medium leading-normal pb-2 ml-1">Email Address</p>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-[#111418] dark:text-white border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-0 focus:ring-2 focus:ring-primary focus:border-primary h-14 placeholder:text-[#617589] p-[15px] pl-12 text-base font-normal" placeholder="name@example.com" type="email"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#617589]">mail</span>
</div>
</label>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-colors shadow-lg shadow-primary/20">
                    Send Reset Code
                </button>
</div>
</div>
<!-- Spacer to push content -->
<div class="flex-grow"></div>
<!-- Bottom Link Section -->
<div class="p-8 text-center">
<a class="text-[#617589] dark:text-gray-400 font-medium hover:text-primary transition-colors flex items-center justify-center gap-2 group" href="#">
<span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Back to Login
            </a>
</div>
<!-- Bottom Home Indicator for iOS Feel -->
<div class="h-5 w-full flex justify-center pb-2">
<div class="w-32 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
</div>
</div>
</body></html>
