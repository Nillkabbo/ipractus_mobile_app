<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPractus Navigation Demo - Exact Designs</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
        }

        /* Demo Navigation Bar */
        #demo-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #demo-nav h1 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #demo-nav-controls {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Screen List Dropdown */
        #demo-screen-list {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            z-index: 9998;
            background: rgba(26, 26, 46, 0.98);
            backdrop-filter: blur(10px);
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.3s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #demo-screen-list.open {
            max-height: calc(100vh - 56px);
        }

        .category-header {
            padding: 12px 20px 8px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .screen-item {
            width: 100%;
            padding: 12px 20px;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .screen-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .screen-item .theme-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .theme-light { background: #137fec; }
        .theme-dark { background: #1173d4; }
        .theme-pistachio { background: #b2f15f; color: #0B132B; }

        /* Iframe Container */
        #screen-frame-container {
            margin-top: 56px;
            height: calc(100vh - 56px);
            display: flex;
            flex-direction: column;
        }

        #current-screen-title {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #screen-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Mobile Device Frame */
        .device-frame {
            max-width: 430px;
            margin: 0 auto;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Scrollbar */
        #demo-screen-list::-webkit-scrollbar {
            width: 8px;
        }

        #demo-screen-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        #demo-screen-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        #demo-screen-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #fff;
            font-size: 14px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Quick navigation buttons */
        #quick-nav {
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        .quick-nav-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #fff;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .quick-nav-btn.active {
            background: #137fec;
            border-color: #137fec;
        }
    </style>
</head>

        // State
        let history = [];
        let currentIndex = -1;
        let currentScreen = null;

        // Initialize
        function init() {
            populateScreenList();
            populateQuickNav();
            loadScreen('welcome');
        }

        // Populate screen list dropdown
        function populateScreenList() {
            const list = document.getElementById('demo-screen-list');
            let currentCategory = '';

            for (const [key, screen] of Object.entries(screens)) {
                // Add category header
                if (screen.category !== currentCategory) {
                    currentCategory = screen.category;
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.textContent = currentCategory;
                    list.appendChild(header);
                }

                // Add screen item
                const item = document.createElement('button');
                item.className = 'screen-item';

                const themeClass = screen.theme === 'light' ? 'theme-light' :
                                  screen.theme === 'dark' ? 'theme-dark' : 'theme-pistachio';

                item.innerHTML = '<span class="theme-badge ' + themeClass + '">' + screen.theme + '</span><span>' + screen.name + '</span>';
                item.onclick = function() {
                    loadScreen(key);
                    list.classList.remove('open');
                };
                list.appendChild(item);
            }
        }

        // Populate quick navigation
        function populateQuickNav() {
            const nav = document.getElementById('quick-nav');
            const flows = {
                'Onboarding': ['welcome', 'role', 'setup_profile', 'otp', 'success'],
                'Auth': ['forgot_password', 'reset_password'],
                'Feed Theme': ['feed', 'feed_pistachio'],
                'Chat Theme': ['chat_1on1', 'chat_1on1_pistachio'],
            };

            for (const [flowName, screenKeys] of Object.entries(flows)) {
                const divider = document.createElement('span');
                divider.style.cssText = 'color: #666; font-size: 10px; padding: 6px 8px; white-space: nowrap;';
                divider.textContent = flowName;
                nav.appendChild(divider);

                for (const key of screenKeys) {
                    if (screens[key]) {
                        const btn = document.createElement('button');
                        btn.className = 'quick-nav-btn';
                        btn.textContent = screens[key].name;
                        btn.onclick = function() { loadScreen(key); };
                        nav.appendChild(btn);
                    }
                }
            }
        }

        // Toggle screen list
        function toggleScreenList() {
            document.getElementById('demo-screen-list').classList.toggle('open');
        }

        // Load screen in iframe
        function loadScreen(screenKey) {
            const screen = screens[screenKey];
            if (!screen) return;

            const iframe = document.getElementById('screen-frame');
            const titleEl = document.getElementById('current-screen-title');

            // Update title
            titleEl.textContent = screen.category + ' → ' + screen.name;

            // Load in iframe
            iframe.src = screen.file;

            // Add to history
            if (currentScreen !== screenKey) {
                history = history.slice(0, currentIndex + 1);
                history.push(screenKey);
                currentIndex = history.length - 1;
                currentScreen = screenKey;
                updateBackButton();
                updateQuickNavActive(screenKey);
            }
        }

        // Go back
        function goBack() {
            if (currentIndex > 0) {
                currentIndex--;
                const screenKey = history[currentIndex];
                currentScreen = screenKey;
                const screen = screens[screenKey];

                document.getElementById('screen-frame').src = screen.file;
                document.getElementById('current-screen-title').textContent = screen.category + ' → ' + screen.name;

                updateBackButton();
                updateQuickNavActive(screenKey);
            }
        }

        // Update back button state
        function updateBackButton() {
            document.getElementById('back-btn').disabled = currentIndex <= 0;
        }

        // Update quick nav active state
        function updateQuickNavActive(screenKey) {
            const btns = document.querySelectorAll('.quick-nav-btn');
            for (let i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
                if (btns[i].textContent === screens[screenKey].name) {
                    btns[i].classList.add('active');
                }
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') goBack();
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
