<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pistachio OTP Verify (v2)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b1e967", // Pistachio
                        "obsidian": "#0B132B",
                        "obsidian-elevated": "#1C2541",
                        "pale-yellow": "#E5F1AF",
                        "background-light": "#f7f8f6",
                        "background-dark": "#0B132B",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B132B;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-white font-display">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-[430px] mx-auto overflow-x-hidden border-x border-white/5 shadow-2xl">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<button class="text-white flex size-12 shrink-0 items-center justify-center hover:bg-white/10 rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<div class="w-12"></div> <!-- Spacer for balance -->
</div>
<div class="flex flex-col flex-1 px-6 pt-8 pb-10">
<!-- Headline Text -->
<h1 class="text-white tracking-tight text-[32px] font-extrabold leading-none text-left pb-2 uppercase italic">
                VERIFY IDENTITY
            </h1>
<!-- Body Text -->
<p class="text-white/70 text-base font-normal leading-normal pb-10 pt-1">
                Enter the 6-digit code sent to your device to continue your performance session.
            </p>
<!-- Confirmation Code Grid -->
<div class="flex justify-between items-center gap-2 py-6">
<fieldset class="flex w-full justify-between gap-2">
<!-- Digit 1 -->
<input autofocus="" class="flex h-16 w-[14%] rounded-xl bg-obsidian-elevated border-2 border-primary text-center text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" maxlength="1" type="number" value="4"/>
<!-- Digit 2 -->
<input class="flex h-16 w-[14%] rounded-xl bg-obsidian-elevated border-2 border-primary text-center text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" maxlength="1" type="number" value="2"/>
<!-- Digit 3 -->
<input class="flex h-16 w-[14%] rounded-xl bg-obsidian-elevated border-2 border-primary/30 text-center text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" maxlength="1" type="number"/>
<!-- Digit 4 -->
<input class="flex h-16 w-[14%] rounded-xl bg-obsidian-elevated border-2 border-primary/30 text-center text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" maxlength="1" type="number"/>
<!-- Digit 5 -->
<input class="flex h-16 w-[14%] rounded-xl bg-obsidian-elevated border-2 border-primary/30 text-center text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" maxlength="1" type="number"/>
<!-- Digit 6 -->
<input class="flex h-16 w-[14%] rounded-xl bg-obsidian-elevated border-2 border-primary/30 text-center text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" maxlength="1" type="number"/>
</fieldset>
</div>
<!-- Meta/Resend Text -->
<div class="mt-4">
<button class="text-pale-yellow text-sm font-semibold leading-normal py-3 w-full text-center hover:opacity-80 transition-opacity underline decoration-1 underline-offset-4">
                    Resend Code
                </button>
</div>
<!-- Primary Action Button (Fixed to bottom or pushed down) -->
<div class="mt-auto pt-10">
<button class="w-full bg-primary hover:bg-primary/90 text-obsidian font-extrabold text-lg py-5 rounded-full uppercase tracking-wider transition-transform active:scale-95 shadow-lg shadow-primary/20">
                    Verify
                </button>
</div>
</div>
<!-- iOS Style Keypad Simulation Area (Visual only) -->
<div class="mt-4 bg-obsidian-elevated/50 p-2 grid grid-cols-3 gap-1 rounded-t-3xl border-t border-white/5">
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">1</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">2</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">abc</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">3</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">def</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">4</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">ghi</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">5</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">jkl</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">6</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">mno</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">7</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">pqrs</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">8</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">tuv</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">9</span>
<span class="text-[10px] text-white/50 -mt-1 uppercase tracking-tighter">wxyz</span>
</div>
<div class="h-14"></div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="text-2xl font-medium">0</span>
</div>
<div class="flex flex-col items-center justify-center h-14 rounded-lg hover:bg-white/10 cursor-pointer">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</div>
<!-- Home Indicator -->
<div class="col-span-3 flex justify-center py-2">
<div class="w-32 h-1.5 bg-white/20 rounded-full"></div>
</div>
</div>
</div>
</body></html>
