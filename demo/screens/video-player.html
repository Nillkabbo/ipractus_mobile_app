<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<!-- Video Container -->
<div class="relative h-screen w-full flex flex-col items-center justify-center bg-black">
<!-- Background Placeholder (Simulating Video Content) -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="Cinematic shot of a soccer player dribbling through cones during a night practice session" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC7PsEicLxKHP5n9vfa0iFSzuFWv2sgodZ4LBdGTbloPzih3cc3-RXxYXHHCZlcp3skl9avd0qmDfDI-O_Bq3koekzt-OugPAM2EW_87bOD6uJLGc4BZtYizDlCdYyrBtvCpvf0Yvs5Ug9e9tEV7LJLV4zMaSSdevagAoy667ilf3yvgOEIOGKrPshV3QirDf65BHgY6xU7YCxWVaH3otwH6WBs2__UJ81Zf2LKS0ATZYxdf3CZFUZBBDj8nEge7AQmlzDBRwGw0kDW');">
<div class="absolute inset-0 bg-black/30"></div>
</div>
<!-- Top AppBar Overlay -->
<div class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between p-4 bg-gradient-to-b from-black/80 to-transparent pt-12">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md hover:bg-black/40 transition-colors">
<span class="material-symbols-outlined text-white text-[24px]">close</span>
</button>
<div class="flex flex-col">
<h2 class="text-white text-base font-bold leading-tight tracking-tight">Tactical Dribbling Drill</h2>
<p class="text-white/60 text-xs font-medium">iPractus Elite Series</p>
</div>
</div>
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md">
<span class="material-symbols-outlined text-white text-[24px]">more_vert</span>
</button>
</div>
<!-- Central CameraControls Overlay -->
<div class="z-20 flex items-center justify-center gap-8">
<button class="flex shrink-0 items-center justify-center rounded-full size-12 bg-black/40 backdrop-blur-md text-white border border-white/10">
<span class="material-symbols-outlined text-[28px]">replay_10</span>
</button>
<button class="flex shrink-0 items-center justify-center rounded-full size-20 bg-primary text-white shadow-xl shadow-primary/20">
<span class="material-symbols-outlined text-[44px]">pause</span>
</button>
<button class="flex shrink-0 items-center justify-center rounded-full size-12 bg-black/40 backdrop-blur-md text-white border border-white/10">
<span class="material-symbols-outlined text-[28px]">forward_10</span>
</button>
</div>
<!-- Bottom Controls Overlay -->
<div class="absolute bottom-0 left-0 right-0 z-20 flex flex-col p-6 bg-gradient-to-t from-black/90 to-transparent pb-10">
<!-- MediaPlayer Components: Progress Bar -->
<div class="mb-4">
<div class="flex items-center justify-between mb-2">
<p class="text-white text-xs font-semibold tracking-wide">01:42</p>
<p class="text-white/60 text-xs font-semibold tracking-wide">04:35</p>
</div>
<div class="relative h-1.5 w-full rounded-full bg-white/20">
<!-- Progress Fill -->
<div class="absolute left-0 top-0 h-full w-1/3 rounded-full bg-primary"></div>
<!-- Seeker Thumb -->
<div class="absolute left-[33%] top-1/2 -translate-y-1/2 size-4 rounded-full bg-white shadow-lg border-2 border-primary"></div>
</div>
</div>
<!-- Toolbar & SegmentedButtons Row -->
<div class="flex items-center justify-between gap-4">
<!-- Speed Selection -->
<div class="flex h-10 w-48 items-center justify-center rounded-xl bg-black/40 backdrop-blur-lg p-1 border border-white/10">
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:text-white text-white/50 text-xs font-bold transition-all">
<span>0.5x</span>
<input class="hidden" name="speed" type="radio" value="0.5x"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:text-white text-white/50 text-xs font-bold transition-all">
<span>1x</span>
<input checked="" class="hidden" name="speed" type="radio" value="1x"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:text-white text-white/50 text-xs font-bold transition-all">
<span>1.5x</span>
<input class="hidden" name="speed" type="radio" value="1.5x"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:text-white text-white/50 text-xs font-bold transition-all">
<span>2x</span>
<input class="hidden" name="speed" type="radio" value="2x"/>
</label>
</div>
<!-- Action Icons -->
<div class="flex items-center gap-2">
<button class="p-2.5 rounded-xl bg-black/40 backdrop-blur-lg border border-white/10 text-white">
<span class="material-symbols-outlined text-[22px]">settings</span>
</button>
<button class="p-2.5 rounded-xl bg-black/40 backdrop-blur-lg border border-white/10 text-white">
<span class="material-symbols-outlined text-[22px]">fullscreen</span>
</button>
</div>
</div>
</div>
<!-- iOS Home Indicator Sim -->
<div class="absolute bottom-1 w-32 h-1.5 bg-white/30 rounded-full left-1/2 -translate-x-1/2 z-30"></div>
</div>
</body></html>
