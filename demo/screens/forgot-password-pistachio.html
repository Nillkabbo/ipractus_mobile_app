<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pistachio Forgot Password (v2)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b2f15f",
                        "obsidian-deep": "#0B132B",
                        "obsidian-elevated": "#1C2541",
                        "background-light": "#f7f8f6",
                        "background-dark": "#0B132B",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B132B;
        }
        .pistachio-border-focus:focus-within {
            border-color: #b2f15f;
            ring: 1px solid #b2f15f;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center">
<div class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl">
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div aria-label="Go back" class="text-black dark:text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12 font-display">iPrActUS</h2>
</div>
<div class="flex-1 flex flex-col px-6">
<!-- Branding/Icon Section -->
<div class="flex justify-center pt-10 pb-6">
<div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[40px]">lock_reset</span>
</div>
</div>
<!-- HeadlineText -->
<h1 class="text-black dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-3 pt-4 font-display uppercase">
                RESET PASSWORD
            </h1>
<!-- BodyText -->
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal pb-8 pt-1 px-4 text-center font-display">
                Enter your email address to receive a recovery code to your inbox
            </p>
<!-- TextField -->
<div class="flex flex-col gap-4 py-3">
<label class="flex flex-col w-full">
<p class="text-black dark:text-gray-300 text-sm font-medium leading-normal pb-2 ml-4">Email Address</p>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-gray-500">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-full text-black dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-transparent bg-gray-200 dark:bg-obsidian-elevated focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder:text-gray-400 pl-12 pr-4 text-base font-normal leading-normal transition-all" placeholder="yourname@email.com" type="email" value=""/>
</div>
</label>
</div>
<!-- SingleButton -->
<div class="flex py-6 mt-4">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-5 flex-1 bg-primary text-obsidian-deep text-base font-bold leading-normal tracking-[0.015em] hover:opacity-90 active:scale-[0.98] transition-all uppercase">
<span class="truncate">SEND CODE</span>
</button>
</div>
<!-- Secondary Action -->
<div class="flex justify-center mt-auto pb-10">
<button class="text-gray-500 dark:text-gray-400 text-sm font-medium hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm">login</span>
                    Back to Sign In
                </button>
</div>
</div>
<!-- Decorative Athletic Pattern (Background) -->
<div class="absolute bottom-0 right-0 w-full h-1/4 opacity-10 pointer-events-none overflow-hidden">
<svg height="100%" preserveaspectratio="none" viewbox="0 0 100 100" width="100%">
<path d="M0 100 L100 0 L100 100 Z" fill="url(#grad1)"></path>
<defs>
<lineargradient id="grad1" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#b2f15f;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#1c2541;stop-opacity:0"></stop>
</lineargradient>
</defs>
</svg>
</div>
</div>
</body></html>
