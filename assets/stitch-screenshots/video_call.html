<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>iPractus Video Call</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "danger": "#ef4444",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom glass effect for iOS feel */
        .glass-overlay {
            background: rgba(16, 25, 34, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-white overflow-hidden font-display">
<!-- Main Full-Screen Video Background (Recipient) -->
<div class="relative h-screen w-full bg-black overflow-hidden">
<!-- Main Video Placeholder -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="Professional sports coach in a training facility speaking during a video call" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCPg4ulYibwzUf9jWgpdNn_vx0dEoQ-i1UJjnE8osmFiBV4gUT5alpWWGnL3GLoq5nrHbrlQa04HwKu3gpUwUiAdwyiZXg0XL6bklIk1d7adU0qiNI0wDcvoAMcjFyST_QCRWCC3kNMZl2BK8IxUMCREeHcfuKajqnK9WPZWz7rgfSQ52T7TWoG-nisPQWbOyUlcZStVgaAKyIBEZr8O0HyKRFP-6ACLXURID9q5QDO8zDKtn4reyvluk29kThZ59sC5okJO3friJpn");'>
</div>
<!-- Top App Bar / Header Overlay -->
<div class="absolute top-0 left-0 right-0 z-20 px-4 pt-12 pb-6 bg-gradient-to-b from-black/60 to-transparent">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<button class="flex items-center justify-center size-10 rounded-full bg-white/10 text-white">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<div>
<h2 class="text-white text-lg font-bold leading-tight tracking-tight">Coach Smith</h2>
<p class="text-primary text-xs font-medium uppercase tracking-wider">Live Call • 04:15</p>
</div>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center gap-1 bg-white/10 px-3 py-1.5 rounded-full">
<div class="size-2 rounded-full bg-green-500 animate-pulse"></div>
<span class="text-xs font-medium">HD</span>
</div>
</div>
</div>
</div>
<!-- Picture-in-Picture (User's View) -->
<div class="absolute top-24 right-4 z-30 w-32 aspect-[3/4] rounded-xl overflow-hidden border-2 border-white/20 shadow-2xl">
<div class="w-full h-full bg-cover bg-center" data-alt="Young athlete in a gym looking into their phone camera" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB-0RkIiwVx5_lKvPCtrLik5LJAuPPztlwCL8ntT9YUF9Dkl_UkaaqLqFXkpyoxJZAOKzBUg9S3LJKUDHjYfjAVhTTQY6--CcVndVjFByF42SSAgUxuDtuwjZptx4rAk1_w_ZCvX_-mmtahBvWxptUJGDVsjOko9_-_YpQ9wCdiDOmqhLi6Mwccsibeweu9XhrYKzllMb_w72CwCVn7AvCwYhECRCRKcmTDvdDue9tvHZtXYM3jsSrTQDX-KP6lCgA8S6yRal1aHscx");'>
</div>
</div>
<!-- Bottom Controls Overlay -->
<div class="absolute bottom-0 left-0 right-0 z-20 px-6 pb-12 pt-12 bg-gradient-to-t from-black/80 to-transparent">
<div class="flex flex-col items-center gap-8">
<!-- Connection Status -->
<div class="text-center">
<p class="text-white/60 text-sm font-medium">Secure Connection Active</p>
</div>
<!-- Action Toolbar -->
<div class="glass-overlay rounded-full px-4 py-4 flex items-center justify-between gap-4 w-full max-w-sm border border-white/10">
<!-- Mic Toggle -->
<button class="flex flex-col items-center gap-1">
<div class="size-12 rounded-full bg-white/10 flex items-center justify-center text-white active:bg-primary">
<span class="material-symbols-outlined">mic</span>
</div>
<span class="text-[10px] font-medium text-white/70">Mute</span>
</button>
<!-- Camera Toggle -->
<button class="flex flex-col items-center gap-1">
<div class="size-12 rounded-full bg-white/10 flex items-center justify-center text-white active:bg-primary">
<span class="material-symbols-outlined">videocam</span>
</div>
<span class="text-[10px] font-medium text-white/70">Camera</span>
</button>
<!-- End Call Button (Primary Action) -->
<button class="flex flex-col items-center gap-1">
<div class="size-16 rounded-full bg-danger flex items-center justify-center text-white shadow-lg shadow-danger/30 hover:bg-red-600 transition-colors">
<span class="material-symbols-outlined text-3xl">call_end</span>
</div>
<span class="text-[10px] font-bold text-danger uppercase tracking-widest mt-1">End</span>
</button>
<!-- Flip Camera -->
<button class="flex flex-col items-center gap-1">
<div class="size-12 rounded-full bg-white/10 flex items-center justify-center text-white active:bg-primary">
<span class="material-symbols-outlined">flip_camera_ios</span>
</div>
<span class="text-[10px] font-medium text-white/70">Flip</span>
</button>
<!-- More Actions -->
<button class="flex flex-col items-center gap-1">
<div class="size-12 rounded-full bg-white/10 flex items-center justify-center text-white active:bg-primary">
<span class="material-symbols-outlined">more_horiz</span>
</div>
<span class="text-[10px] font-medium text-white/70">More</span>
</button>
</div>
</div>
</div>
<!-- Call Status UI / Subtle Indicators -->
<div class="absolute bottom-40 left-6 z-20">
<div class="flex items-center gap-2 bg-black/40 backdrop-blur-md px-3 py-1 rounded-lg border border-white/5">
<span class="material-symbols-outlined text-primary text-sm">signal_cellular_alt</span>
<span class="text-xs font-medium text-white/90 tracking-wide">Excellent Signal</span>
</div>
</div>
</div>
</body></html>
