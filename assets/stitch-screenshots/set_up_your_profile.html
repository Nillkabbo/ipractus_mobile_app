<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set Up Your Profile - iPractus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Set Up Your Profile</h2>
</header>
<main class="flex-1 flex flex-col px-6 pb-10 max-w-md mx-auto w-full">
<!-- Profile Header / Avatar Upload -->
<div class="flex py-8 @container">
<div class="flex w-full flex-col gap-4 items-center">
<div class="flex gap-6 flex-col items-center">
<div class="relative">
<!-- Circular Placeholder with Camera Icon -->
<div class="bg-slate-200 dark:bg-[#1c2127] border-2 border-dashed border-slate-400 dark:border-[#3b4754] aspect-square rounded-full min-h-32 w-32 flex items-center justify-center overflow-hidden" data-alt="Circular profile picture placeholder with camera icon">
<span class="material-symbols-outlined text-4xl text-primary">photo_camera</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary p-2 rounded-full border-4 border-background-light dark:border-background-dark">
<span class="material-symbols-outlined text-white text-sm">add</span>
</div>
</div>
<div class="flex flex-col items-center justify-center">
<p class="text-slate-900 dark:text-white text-[22px] font-bold leading-tight tracking-tight text-center">Add a photo</p>
<p class="text-slate-500 dark:text-[#9dabb9] text-base font-normal leading-normal text-center mt-1">Let the community know who you are</p>
</div>
</div>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-4">
<!-- Full Name -->
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-700 dark:text-white text-sm font-medium leading-normal pb-2">Full Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#1c2127] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9dabb9] px-4 text-base font-normal leading-normal" placeholder="e.g. Alex Thompson" value=""/>
</label>
</div>
<!-- Location with Map Pin -->
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-700 dark:text-white text-sm font-medium leading-normal pb-2">Location</p>
<div class="flex w-full flex-1 items-stretch rounded-lg shadow-sm">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#1c2127] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9dabb9] px-4 rounded-r-none border-r-0 text-base font-normal leading-normal" placeholder="Search your city" value=""/>
<div class="text-slate-400 dark:text-[#9dabb9] flex border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#1c2127] items-center justify-center px-4 rounded-r-lg border-l-0">
<span class="material-symbols-outlined" data-location="City location search">location_on</span>
</div>
</div>
</label>
</div>
<!-- Role Specific Field: Primary Sport (Athlete context) -->
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-700 dark:text-white text-sm font-medium leading-normal pb-2">Primary Sport</p>
<div class="relative">
<select class="appearance-none form-select flex w-full min-w-0 flex-1 rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4754] bg-white dark:bg-[#1c2127] focus:border-primary h-14 px-4 text-base font-normal leading-normal">
<option disabled="" selected="" value="">Select your sport</option>
<option value="basketball">Basketball</option>
<option value="soccer">Soccer</option>
<option value="tennis">Tennis</option>
<option value="running">Running</option>
<option value="swimming">Swimming</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 dark:text-[#9dabb9]">
<span class="material-symbols-outlined">unfold_more</span>
</div>
</div>
</label>
</div>
<!-- Secondary Role Info (Subtle hint) -->
<p class="text-slate-500 dark:text-[#9dabb9] text-xs px-1">
                You can change your role and preferences later in settings.
            </p>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-grow"></div>
<!-- Action Button -->
<div class="mt-10 pb-6">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 px-6 rounded-xl transition-colors duration-200 shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span>Complete Setup</span>
<span class="material-symbols-outlined text-xl">check_circle</span>
</button>
<div class="mt-4 flex justify-center items-center gap-1">
<div class="h-1 w-8 rounded-full bg-primary"></div>
<div class="h-1 w-8 rounded-full bg-primary"></div>
<div class="h-1 w-8 rounded-full bg-primary"></div>
<div class="h-1 w-8 rounded-full bg-slate-300 dark:bg-[#3b4754]"></div>
</div>
</div>
</main>
<!-- iOS Home Indicator Spacing -->
<div class="h-8 bg-background-light dark:bg-background-dark"></div>
</body></html>
