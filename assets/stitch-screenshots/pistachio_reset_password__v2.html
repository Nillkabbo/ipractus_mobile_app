<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pistachio Reset Password (v2)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b2f15f", // Pistachio
                        "obsidian": "#0b132b", // Background
                        "obsidian-elevated": "#1c2541", // Input fields
                        "background-light": "#f7f8f6",
                        "background-dark": "#0b132b",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col text-white">
<!-- Top Navigation -->
<header class="flex items-center px-4 py-6">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white text-[28px]">arrow_back_ios_new</span>
</button>
</header>
<main class="flex-1 flex flex-col px-6">
<!-- Headline Section -->
<section class="mb-10">
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight uppercase font-display">
                NEW PASSWORD
            </h1>
<p class="text-[#adb99d] text-sm mt-2 font-medium">Set your new secure credentials to access your iPrActUS profile.</p>
</section>
<!-- Form Section -->
<div class="space-y-6">
<!-- New Password Input -->
<div class="flex flex-col gap-2">
<label class="text-white text-sm font-semibold uppercase tracking-wider ml-1">New Password</label>
<div class="relative flex items-center">
<input class="w-full h-16 bg-obsidian-elevated border-none rounded-full px-6 text-white placeholder:text-[#adb99d]/50 focus:ring-2 focus:ring-primary/50 transition-all font-display" placeholder="Enter your new password" type="password"/>
<button class="absolute right-5 text-[#adb99d] hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-2">
<label class="text-white text-sm font-semibold uppercase tracking-wider ml-1">Confirm Password</label>
<div class="relative flex items-center">
<input class="w-full h-16 bg-obsidian-elevated border-none rounded-full px-6 text-white placeholder:text-[#adb99d]/50 focus:ring-2 focus:ring-primary/50 transition-all font-display" placeholder="Re-enter your password" type="password"/>
<button class="absolute right-5 text-[#adb99d] hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Requirements Checklist -->
<section class="mt-8 space-y-4 px-2">
<div class="flex items-center gap-3">
<div class="flex size-6 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
<p class="text-white/90 text-base font-medium font-display">At least 8 characters</p>
</div>
<div class="flex items-center gap-3">
<div class="flex size-6 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
<p class="text-white/90 text-base font-medium font-display">Includes a number</p>
</div>
<div class="flex items-center gap-3 opacity-50">
<div class="flex size-6 items-center justify-center rounded-full border-2 border-[#49543b]">
</div>
<p class="text-white/70 text-base font-medium font-display">Includes a special character</p>
</div>
</section>
<!-- Spacer for push -->
<div class="flex-1"></div>
<!-- Primary Action -->
<div class="py-10">
<button class="w-full bg-primary hover:bg-[#a1dc52] text-obsidian font-bold text-lg h-16 rounded-full flex items-center justify-center transition-all active:scale-[0.98] shadow-lg shadow-primary/20">
                Update Password
            </button>
</div>
</main>
<!-- Visual Accent Element (Subtle abstract pattern) -->
<div class="fixed top-0 right-0 -z-10 w-full h-full overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-[20%] -right-[10%] w-[80%] h-[50%] bg-gradient-to-br from-primary/30 to-transparent blur-[120px] rounded-full"></div>
</div>
</body></html>
